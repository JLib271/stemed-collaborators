# Generated by: python -m stemed_collaborators.forms --write
name: Join or update the directory
description: 'Researchers, teachers, instructors, and informal educators: list yourself so people can find you and message
  you on STEMEd+ Commons.'
title: 'Join: '
labels:
- 'directory: join'
body:
- type: markdown
  attributes:
    value: 'Thanks for joining! Everything you enter here is **public**. Your email address is never shown: people contact
      you through STEMEd+ Commons.


      You need a free STEMEd+ Commons account first. Before you are listed, a maintainer sends you a private message on STEMEd+
      Commons to confirm it is really you.


      **Updating your profile?** Fill in the whole form again; the new answers replace the old ones. Profiles are shown for
      one year after they are last confirmed, so send this form once a year to stay listed.'
- type: input
  id: name
  attributes:
    label: Your name as you want it shown
    placeholder: e.g. Maria Lopez
  validations:
    required: true
- type: input
  id: username
  attributes:
    label: Your STEMEd+ Commons username
    description: The name after /members/ in your profile link, e.g. libarkin in stemedplus.profile.hcommons.org/members/libarkin/
    placeholder: e.g. mlopez
  validations:
    required: true
- type: input
  id: commons_profile
  attributes:
    label: Link to your STEMEd+ Commons profile
    placeholder: https://stemedplus.profile.hcommons.org/members/yourname/
  validations:
    required: true
- type: input
  id: pronouns
  attributes:
    label: Pronouns (optional)
    placeholder: e.g. she/her
- type: dropdown
  id: career_stage
  attributes:
    label: Career stage
    options:
    - Graduate student
    - Postdoc
    - Early-career faculty or researcher
    - Mid-career faculty or researcher
    - Senior faculty or researcher
    - Teacher (K-12)
    - College instructor or lecturer
    - Informal educator (museum, nature center, after-school, or outreach)
    - Education leader or administrator
    - Staff or practitioner
    - Other
  validations:
    required: true
- type: input
  id: institution
  attributes:
    label: Institution or organization (optional)
    placeholder: e.g. University of Texas Rio Grande Valley
- type: checkboxes
  id: institution_types
  attributes:
    label: Institution type (optional, choose any)
    options:
    - label: Minority-serving institution (HSI, HBCU, TCU, AANAPISI, or other MSI)
    - label: Primarily undergraduate institution
    - label: Community or technical college
    - label: Research university
    - label: K-12 school or district
    - label: Nonprofit, museum, or informal learning
    - label: Government or industry
    - label: Outside the US
    - label: Independent scholar
- type: checkboxes
  id: disciplines
  attributes:
    label: Disciplines (choose at least one)
    options:
    - label: Agriculture
    - label: Bioscience
    - label: Chemistry
    - label: Earth Science
    - label: Engineering
    - label: Health Education
    - label: History & Philosophy of Science
    - label: Human Dimensions
    - label: Learning Science
    - label: Mathematics
    - label: Physics
    - label: Science & Health Communication
    - label: Science Education
- type: checkboxes
  id: methods
  attributes:
    label: Methods and expertise (choose at least one)
    options:
    - label: Interviews and focus groups
    - label: Qualitative analysis
    - label: Ethnography and observation
    - label: Discourse and video analysis
    - label: Surveys
    - label: Instrument development and psychometrics
    - label: Statistical modeling
    - label: Experimental and quasi-experimental design
    - label: Mixed methods
    - label: Design-based research
    - label: Learning analytics and educational data mining
    - label: Network analysis
    - label: Systematic reviews and meta-analysis
    - label: Program evaluation
    - label: Critical and community-engaged methods
    - label: Curriculum and course design
    - label: Computational and AI methods
    - label: Classroom teaching practice
    - label: Informal and out-of-school learning
    - label: Outreach and public engagement
    - label: Professional learning design
- type: input
  id: topics
  attributes:
    label: Topics you work on (optional)
    description: Separate topics with commas.
    placeholder: e.g. sense of belonging, organic chemistry labs, teaching assistants
- type: markdown
  attributes:
    value: '**What you can offer and what you are looking for** use the same list, so people can find two-way matches. Please
      fill in both. If you only want to offer help right now, leave "What you are looking for" blank.'
- type: checkboxes
  id: offers
  attributes:
    label: What you can offer others (choose at least one)
    options:
    - label: Co-PI or grant partner
    - label: Methods partner
    - label: Discipline content expert
    - label: Study site or data partner
    - label: Co-author on a paper
    - label: Proposal or paper reader
    - label: Writing or accountability partner
    - label: Mentor
    - label: Mentee
    - label: Conference session partner
    - label: Research-practice partner
    - label: Researcher for a classroom or program
    - label: Practitioner partner for a research project
    - label: Broader impacts or outreach partner
    - label: Professional learning or workshop facilitator
    - label: Teaching or curriculum partner
- type: checkboxes
  id: seeking
  attributes:
    label: What you are looking for (optional)
    options:
    - label: Co-PI or grant partner
    - label: Methods partner
    - label: Discipline content expert
    - label: Study site or data partner
    - label: Co-author on a paper
    - label: Proposal or paper reader
    - label: Writing or accountability partner
    - label: Mentor
    - label: Mentee
    - label: Conference session partner
    - label: Research-practice partner
    - label: Researcher for a classroom or program
    - label: Practitioner partner for a research project
    - label: Broader impacts or outreach partner
    - label: Professional learning or workshop facilitator
    - label: Teaching or curriculum partner
- type: textarea
  id: about
  attributes:
    label: A few sentences about your work
    description: Up to 400 characters. What you study, teach, or lead, and what kind of collaboration you want.
    placeholder: I study how first-generation students ...
  validations:
    required: true
- type: input
  id: orcid
  attributes:
    label: ORCID iD (optional)
    placeholder: 0000-0002-1825-0097
- type: checkboxes
  id: consent
  attributes:
    label: Consent
    options:
    - label: I am the person described in this form.
      required: true
    - label: I agree that everything in this form will be shown publicly on STEMEd+ Collaborators and kept in its GitHub repository.
      required: true
    - label: I understand a maintainer will message me on STEMEd+ Commons to confirm before I am listed, and that I can ask
        to be removed at any time.
      required: true
