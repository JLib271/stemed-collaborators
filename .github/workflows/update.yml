name: Update and publish

# Every day: read STEMEd+ Commons profiles, save the cards in data/collaborators.json (only when something
# changed, and never replacing a good copy with a broken read), and build the page.
#
# The page is published to GitHub Pages while config/site.json has "publish": true. Set it to false to stop
# publishing; each run also keeps the page as a download (Artifacts: "find-collaborators-page").
# Turn on once: Settings -> Pages -> Source: GitHub Actions. On a free plan the repository must be public.

on:
  schedule:
    - cron: "23 10 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      preview: ${{ steps.mode.outputs.preview }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Read STEMEd+ Commons profiles
        if: github.event_name != 'pull_request'
        run: python -m stemed_collaborators --refresh
      - name: Save the cards if they changed
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update cards from STEMEd+ Commons profiles"
            git push
          fi
      - name: Refresh the shared STEMEd+ look
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/stemedplus/stemedplus-theme.git "$RUNNER_TEMP/stemedplus-theme"
          python "$RUNNER_TEMP/stemedplus-theme/apply.py" .
      - name: Build the page
        run: python -m stemed_collaborators --out output
      - name: Publish?
        id: mode
        run: python -c "import json; c=json.load(open('config/site.json')); print('preview=' + ('false' if c.get('publish') else 'true'))" >> "$GITHUB_OUTPUT"
      - name: Keep the page as a download
        uses: actions/upload-artifact@v5
        with:
          name: find-collaborators-page
          path: output
          retention-days: 14
      - name: Prepare the page for GitHub Pages
        if: steps.mode.outputs.preview == 'false' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

  publish:
    needs: update
    if: needs.update.outputs.preview == 'false' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
